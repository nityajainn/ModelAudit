[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "modelaudit"
version = "0.1.0"
description = "An incremental offline model-audit toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6,<7",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
]

[project.scripts]
modelaudit = "modelaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
tracking = ["mlflow>=3.7,<4"]
verify = [
    "build>=1.2,<2",
    "coverage>=7.10.6,<8",
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[tool.coverage.run]
source_pkgs = ["modelaudit"]
branch = true
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
precision = 2
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100
