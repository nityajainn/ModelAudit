[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "modelaudit"
version = "0.1.0"
description = "An incremental offline model-audit toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]
