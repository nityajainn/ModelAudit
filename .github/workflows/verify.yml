name: Verify ModelAudit

on:
  push:
    branches: [main, 'phase/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.6,<1'
      - run: python -m ruff check --select E9,F .
      - run: python -m ruff check scripts/check_release.py scripts/wheel_smoke.py tests/test_phase8.py src/modelaudit/tracking.py src/modelaudit/model_metadata.py tests/test_phase9.py
      - run: python -m ruff format --check scripts/check_release.py scripts/wheel_smoke.py tests/test_phase8.py src/modelaudit/tracking.py src/modelaudit/model_metadata.py tests/test_phase9.py

  tests:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11', measure: false}
          - {os: ubuntu-24.04, python: '3.12', measure: true}
          - {os: windows-2025, python: '3.12', measure: false}
    env:
      COVERAGE_FILE: ${{ github.workspace }}/reports/generated/ci/.coverage
      COVERAGE_RCFILE: ${{ github.workspace }}/pyproject.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[verify,tracking]'
      - run: python -m pip check
      - run: python -m pip freeze
      - run: python -c "from pathlib import Path; Path('reports/generated/ci').mkdir(parents=True)"
      - if: ${{ !matrix.measure }}
        run: python -m pytest -q -p no:cacheprovider --junitxml=reports/generated/ci/junit.xml
      - if: matrix.measure
        run: |
          python -m coverage run -m pytest -q -p no:cacheprovider --junitxml=reports/generated/ci/junit.xml
          python -m coverage combine
          python -m coverage json --fail-under=0 -o reports/generated/ci/coverage.json
          python -m coverage xml --fail-under=0 -o reports/generated/ci/coverage.xml
          python scripts/check_release.py coverage reports/generated/ci/coverage.json
          python -m coverage report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: test-evidence-${{ matrix.os }}-${{ matrix.python }}
          retention-days: 7
          path: |
            reports/generated/ci/junit.xml
            reports/generated/ci/coverage.json
            reports/generated/ci/coverage.xml

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install 'build>=1.2,<2'
      - run: python -m build
      - run: python scripts/check_release.py archives dist
      - name: Test installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          wheel_python="$RUNNER_TEMP/wheel-env/bin/python"
          "$wheel_python" -m pip install dist/*.whl
          "$wheel_python" -m pip check
          cp scripts/wheel_smoke.py "$RUNNER_TEMP/wheel_smoke.py"
          cd "$RUNNER_TEMP"
          "$wheel_python" -I wheel_smoke.py "$GITHUB_WORKSPACE/reports/generated/ci/wheel"
          "$wheel_python" -m pip install "modelaudit[tracking]"
          "$wheel_python" -m pip check
          "$wheel_python" -I wheel_smoke.py "$GITHUB_WORKSPACE/reports/generated/ci/tracking" --tracking
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: installed-wheel-evidence
          retention-days: 7
          path: |
            reports/generated/ci/wheel/summary.json
            reports/generated/ci/wheel/clean/report.json
            reports/generated/ci/wheel/contamination/report.json
            reports/generated/ci/tracking/summary.json
            reports/generated/ci/tracking/clean/report.json
            reports/generated/ci/tracking/contamination/report.json
